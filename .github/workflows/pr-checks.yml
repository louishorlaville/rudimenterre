name: PR checks

on:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-checks:
    name: PR checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check text encoding
        run: npm run check:encoding

      - name: Check deployment ownership
        run: npm run check:deployment-workflow

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check catalog and search behavior
        run: npm run check:catalog

      - name: Check account phone and Admin token behavior
        run: |
          npm run check:customer-phone
          npm run check:admin-token

      - name: Check editorial content contracts
        run: npm run check:editorial

      - name: Build storefront
        run: npm run build

      - name: Check route manifest
        run: npm run check:route-manifest

      - name: Check patched framework and migrated integrations
        run: npm run check:framework
