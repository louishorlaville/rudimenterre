name: Deploy Oxygen Production

on:
  push:
    branches:
      - main

permissions:
  contents: read
  deployments: write

concurrency:
  group: oxygen-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy main to Oxygen Production
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Oxygen Production
        run: npx shopify hydrogen deploy --env-branch main
        env:
          SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN: ${{ secrets.SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN }}
