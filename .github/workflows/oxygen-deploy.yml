name: Deploy to Oxygen

on:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read
  deployments: write

concurrency:
  group: oxygen-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ github.ref_name }} to Oxygen
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy matching Oxygen environment
        run: npx shopify hydrogen deploy --env-branch "$GITHUB_REF_NAME"
        env:
          SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN: ${{ secrets.SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN }}
